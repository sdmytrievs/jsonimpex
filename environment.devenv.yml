name: jsonimpex

dependencies:
  - gxx_linux-64>=9.4.0  # [linux]
  - cmake>=3.13
  - ninja # [unix]
  - make  # [win]
  - git
  - ccache  # [unix]
  - curl
  - nlohmann_json
  - spdlog
  - yaml-cpp
  - pugixml
  - lua

environment:

  LD_LIBRARY_PATH:                                                   # [unix]
    - {{ root }}/artifacts/lib                                       # [unix]

  PATH:                                                              # [win]
    - {{ root }}\artifacts\bin                                       # [win]
