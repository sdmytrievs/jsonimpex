name: jsonimpex17

dependencies:
  - gxx_linux-64=9.3.0  # [linux]
  - cmake>=3.7
  - ninja # [unix]
  - make  # [win]
  - git
  - ccache  # [unix]
  - curl
  - nlohmann_json
  - velocypack
  - jsonarango
  - yaml-cpp
  - pugixml
  - boost-cpp>=1.72.0
  - thrift-cpp
  - lua

environment:

  LD_LIBRARY_PATH:                                                   # [unix]
    - {{ root }}/artifacts/lib                                       # [unix]

  PATH:                                                              # [win]
    - {{ root }}\artifacts\bin                                       # [win]
